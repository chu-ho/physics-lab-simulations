unction.jpg"},{"id":"057","title":"橫波的力學能","category":"波動","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/waveEnergyOnString/waveEnergyOnString.html","status":"HTML5 畫布已載入","type":"html5-canvas","text":"行進波與駐波傳遞時，動能與彈力位能是如何分佈的呢？","screenshot":"screenshots/057-waveEnergyOnString.jpg"},{"id":"058","title":"雙點波源干涉","category":"波動","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/interferenceTwoSource2023/interferenceTwoSource2023.html","status":"HTML5 畫布已載入","type":"html5-canvas","text":"雙點波源，藉由建設性干涉與破壞性干涉形成腹線與節線","screenshot":"screenshots/058-interferenceTwoSource2023.jpg"},{"id":"059","title":"共鳴氣柱實驗","category":"聲音","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/resonanceExperiment/resonanceExperiment.html","status":"Flash，僅截圖","type":"flash-screenshot","text":"這是實驗室裡找聲波波長實驗的模擬動畫，動畫中，調整水杯的高低可改變空氣柱的長度， 當空氣駐的長度符合某些條件時，音叉發出的聲波就會在空氣柱中形成駐波，決定聲音是否共鳴。","screenshot":"screenshots/059-resonanceExperiment.jpg"},{"id":"060","title":"波以耳實驗","category":"聲音","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/bell/bell.html","status":"Flash，僅截圖","type":"flash-screenshot","text":"波以耳的實驗，玻璃罩內的空氣經由幫浦抽掉後，鈴聲就傳不出來了。 證明了聲波是需要介質傳遞的。記的開喇叭。","screenshot":"screenshots/060-bell.jpg"},{"id":"061","title":"聲速","category":"聲音","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/speedSound/speedSound.html","status":"Flash，僅截圖","type":"flash-screenshot","text":"小明和姊姊出去玩，結果和姊姊走丟了，原來他和姊姊在山中的岔路分開，各自登上了一座山， 小明哭著要找姊姊，請問姊姊何時會聽到小明的哭聲？ 調整動畫中北風與太陽的大小可決定環境的溫度，而決定聲音的速度。 想一想，溫度越高，聲速越快還是越慢？","screenshot":"screenshots/061-speedSound.jpg"},{"id":"062","title":"回聲","category":"聲音","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/backSound/backSound.html","status":"Flash，僅截圖","type":"flash-screenshot","text":"接續前一個小明和姊姊走失的故事(聲速的動畫)...... 姊姊聽到哭聲後立刻下山要來找小明，這時小明的哭聲藉由山壁反射回來， 小明聽到自己的回聲就開始思考，如果山壁靠的太近，會不會就分不出原聲與回聲？ 請你用滑鼠移動山壁，幫小明解決疑惑吧。 山壁靠多近時，會分不出原聲與回聲呢？","screenshot":"screenshots/062-backSound.jpg"},{"id":"063","title":"都卜勒效應","category":"聲音","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/DopplerEffect2024/DopplerEffect2024.html","status":"HTML5 畫布已載入","type":"html5-canvas","text":"聲源移動改變波長 觀察者移動改變波速 兩個人一起改變頻率 就是都普勒效應","screenshot":"screenshots/063-DopplerEffect2024.jpg"},{"id":"064","title":"聲音三要素","category":"聲音","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/soundCHCH/soundCHCH.html","status":"Flash，僅截圖","type":"flash-screenshot","text":"這個動畫在說明聲音三要素，利用右邊的按鈕，你可以選擇不同的聲音高低，也可以選擇 不同的音色，或者聽聽噪音。按下播放鈕，聲音就會自動播放，還可以調整聲音大小喔。 聲音的波形會顯示在中間的螢幕上，仔細觀察，想一想： 聲音的響度由聲波的哪個性質決定？ 聲音的高低由聲波的哪個性質決定？ 聲音的品質由聲波的哪個性質決定？","screenshot":"screenshots/064-soundCHCH.jpg"},{"id":"065","title":"頻譜與波形","category":"聲音","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/soundWaveform/soundWaveform.html","status":"Flash，僅截圖","type":"flash-screenshot","text":"頻譜與波形的動畫，其實就是新版的聲音三要素。 你可以調整基音泛音的振幅比例、基音的頻率以及音量大小，觀察頻譜與波形的變化。 想一想，利用這個動畫，你能說明什麼是「音調相同但音色不同」嗎？","screenshot":"screenshots/065-soundWaveform.jpg"},{"id":"066","title":"方波傅立葉","category":"聲音","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/fourierSqareWave/fourierSqareWave.html","status":"HTML5 畫布已載入","type":"html5-canvas","text":"不同頻率與振幅的簡諧運動疊加成方波","screenshot":"screenshots/066-fourierSqareWave.jpg"},{"id":"067","title":"平面鏡成像","category":"幾何光學","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/mirrorImage2021/mirrorImage2021.html","status":"HTML5 畫布已載入","type":"html5-canvas","text":"平面鏡成像，鏡子可以調整位置和長度喔！眼睛也可以調整位置， 試試看，哪些物體的像看得見，哪些看不見呢？","screenshot":"screenshots/067-mirrorImage2021.jpg"},{"id":"068","title":"兩人同鏡","category":"幾何光學","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/twoPersonOneMirror2021/twoPersonOneMirror2021.html","status":"HTML5 畫布已載入","type":"html5-canvas","text":"兩人同鏡。 兩個人共用同一面鏡子，鏡子要多長，才能讓兩個人都看到自己全身的像呢？","screenshot":"screenshots/068-twoPersonOneMirror2021.jpg"},{"id":"069","title":"雙鏡成多像","category":"幾何光學","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/doubleMirrorImage2021/doubleMirrorImage2021.html","status":"HTML5 畫布已載入","type":"html5-canvas","text":"雙鏡成多像。 兩個平面鏡夾90度，試問站在兩鏡中間的人可以看到幾個像？ 這是一個參考書裡常見的考題，每次說明時，都覺得講一百句話不如看一眼。 上面的動畫中，你可以調整鏡子所夾的角度，物體與眼睛的位置，將滑鼠移到像的位置，還可看到光是如何打進眼睛的。 仔細觀察，你發現了嗎？ 反射奇數次的影像會左右相反，反射偶數次的則不會。 試試看，你還能發現哪些以前不曾注意過","screenshot":"screenshots/069-doubleMirrorImage2021.jpg"},{"id":"070","title":"曲面鏡反射","category":"幾何光學","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/curveMirrorReflection2021/curveMirrorReflection2021.html","status":"HTML5 畫布已載入","type":"html5-canvas","text":"曲面鏡反射 試試看 1.平行光平行對稱軸射向拋物面鏡。 2.點光源由橢圓面鏡的其中一個焦點射出。 3.點光源由雙曲面鏡的其中一個焦點射出。","screenshot":"screenshots/070-curveMirrorReflection2021.jpg"},{"id":"071","title":"成像作圖","category":"幾何光學","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/imageDrawing2023/imageDrawing2023.html","status":"HTML5 畫布已載入","type":"html5-canvas","text":"成像作圖","screenshot":"screenshots/071-imageDrawing2023.jpg"},{"id":"072","title":"折射的原因","category":"幾何光學","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/deflection2023/deflection2023.html","status":"HTML5 畫布已載入","type":"html5-canvas","text":"把光線想像成二輪車，可以看到： (1)光由快到慢，偏向法線 (2)光由慢到快，偏離法線 (3)光由慢到快，且入射角大於臨界角，不折射全反射。","screenshot":"screenshots/072-deflection2023.jpg"},{"id":"073","title":"多層折射","category":"幾何光學","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/mutiLayer/mutiLayer.html","status":"Flash，僅截圖","type":"flash-screenshot","text":"這個動畫演示光線經過多層平行介質的折射情形。 你可以拖曳光線入設的位置，入設的角度，或改變四層介質的折射率， 並觀察光線折射的情形。 動畫中幫你預設好四種情形，你可以一一檢視。 其中第4種情況如下圖： 請你想一想：界面1有可能發生全反射嗎？界面2有可能發生全反射嗎？ 動手試試看吧！","screenshot":"screenshots/073-mutiLayer.jpg"},{"id":"074","title":"杯中吸管","category":"幾何光學","url":"https://www.haha90.url.tw/content/TeachAnime/allTeachinfAnimation/strawInCup2026/strawInCup2026.html","status":"HTML5 畫布已載入","type":"html
