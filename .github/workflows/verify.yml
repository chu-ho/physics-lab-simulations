name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated files are up to date
        run: |
          node tools/build-catalog.cjs --check
          node tools/build-map-fallback.cjs --check
      - name: Documentation and context routes
        run: node tools/check-context.cjs
      - name: Full verification suite
        run: node verify-all.cjs
